<!-- Global Background Shader -->
<!-- STITCH_SHADER_START:ANIMATION_14 class="fixed inset-0 w-full h-full opacity-60 pointer-events-none" -->
<div class="fixed inset-0 w-full h-full opacity-60 pointer-events-none" style="display:block;">
  <canvas id="shader-canvas-ANIMATION_14" style="display:block;width:100%;height:100%"></canvas>
  <script>
  (function() {
    const canvas = document.getElementById('shader-canvas-ANIMATION_14');

    function syncSize() {
      const w = canvas.clientWidth  || 1280;
      const h = canvas.clientHeight || 720;
      if (canvas.width !== w || canvas.height !== h) {
        canvas.width  = w;
        canvas.height = h;
      }
    }
    if (typeof ResizeObserver !== 'undefined') {
      new ResizeObserver(syncSize).observe(canvas);
    }
    syncSize();

    const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
    if (!gl) return;
    const vs = `attribute vec2 a_position;
varying vec2 v_texCoord;
void main() {
  v_texCoord = a_position * 0.5 + 0.5;
  gl_Position = vec4(a_position, 0.0, 1.0);
}`;
    const fs = `precision highp float;
varying vec2 v_texCoord;
uniform float u_time;
uniform vec2 u_resolution;

void main() {
    vec2 uv = v_texCoord;
    
    // Create a smooth, organic flow using time-shifted sine waves
    float noise = sin(uv.x * 3.0 + u_time * 0.5) * cos(uv.y * 2.0 - u_time * 0.3);
    noise += sin(uv.y * 5.0 + u_time * 0.8) * cos(uv.x * 4.0 + u_time * 0.2);
    
    // Base dark obsidian color
    vec3 baseColor = vec3(0.035, 0.043, 0.063); // #090B10
    
    // Subtle gold/amber glow highlights
    vec3 accentColor = vec3(0.965, 0.718, 0.235); // #F6B73C
    
    // Mix based on the procedural noise
    float highlight = smoothstep(0.1, 0.9, noise * 0.5 + 0.5);
    vec3 finalColor = mix(baseColor, baseColor + accentColor * 0.08, highlight);
    
    // Add a subtle vignette
    float vignette = 1.0 - length(uv - 0.5) * 1.2;
    finalColor *= smoothstep(0.0, 0.8, vignette);

    gl_FragColor = vec4(finalColor, 1.0);
}`;
    function cs(type, src) {
      const s = gl.createShader(type);
      gl.shaderSource(s, src);
      gl.compileShader(s);
      return s;
    }
    const prog = gl.createProgram();
    gl.attachShader(prog, cs(gl.VERTEX_SHADER, vs));
    gl.attachShader(prog, cs(gl.FRAGMENT_SHADER, fs));
    gl.linkProgram(prog);
    gl.useProgram(prog);
    const buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
    const pos = gl.getAttribLocation(prog, 'a_position');
    gl.enableVertexAttribArray(pos);
    gl.vertexAttribPointer(pos, 2, gl.FLOAT, false, 0, 0);
    const uTime = gl.getUniformLocation(prog, 'u_time');
    const uRes = gl.getUniformLocation(prog, 'u_resolution');
    const uMouse = gl.getUniformLocation(prog, 'u_mouse');

    let mouse = { x: canvas.width / 2, y: canvas.height / 2 };
    window.addEventListener('mousemove', (event) => {
      const rect = canvas.getBoundingClientRect();
      if (rect.width && rect.height) {
        const nx = (event.clientX - rect.left) / rect.width;
        const ny = 1.0 - (event.clientY - rect.top) / rect.height;
        mouse.x = nx * canvas.width;
        mouse.y = ny * canvas.height;
      }
    });

    function render(t) {
      if (typeof ResizeObserver === 'undefined') syncSize();
      gl.viewport(0, 0, canvas.width, canvas.height);
      if (uTime) gl.uniform1f(uTime, t * 0.001);
      if (uRes) gl.uniform2f(uRes, canvas.width, canvas.height);
      if (uMouse) gl.uniform2f(uMouse, mouse.x, mouse.y);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
      requestAnimationFrame(render);
    }
    render(0);
  })();
  </script>

<main class="relative flex flex-col items-center justify-center min-h-screen pt-16 pb-32 px-container-padding">
  <!-- Kivo Intelligence Orb -->
  <div class="relative w-full max-w-[500px] aspect-square flex items-center justify-center mb-stack-lg">
    <div class="absolute inset-0 bg-secondary/5 blur-[120px] rounded-full scale-75 animate-pulse"></div>
    <div class="orb-container relative w-[240px] h-[240px] md:w-[320px] md:h-[320px] animate-float">
      <!-- STITCH_THREEJS_START:ANIMATION_15 class="w-full h-full" -->
      <div class="w-full h-full" style="display:block;">
        <script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
        <div id="threejs-container-ANIMATION_15" style="width:100%;height:100%"></div>
        <script>
        (function() {
          const container = document.getElementById('threejs-container-ANIMATION_15');
          const width = container.clientWidth || window.innerWidth;
          const height = container.clientHeight || window.innerHeight;

          const scene = new THREE.Scene();
          const camera = new THREE.PerspectiveCamera(75, width / height, 0.1, 1000);
          const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });

          renderer.setSize(width, height);
          renderer.setPixelRatio(window.devicePixelRatio || 1);
          container.appendChild(renderer.domElement);

          // Kivo Intelligence Orb
          const geometry = new THREE.IcosahedronGeometry(1.5, 64);
          const material = new THREE.MeshPhongMaterial({
              color: 0xF6B73C,
              emissive: 0xF6B73C,
              emissiveIntensity: 0.5,
              shininess: 100,
              transparent: true,
              opacity: 0.9,
              wireframe: false
          });

          const orb = new THREE.Mesh(geometry, material);
          scene.add(orb);

          // Add inner core for depth
          const coreGeom = new THREE.SphereGeometry(0.8, 32, 32);
          const coreMat = new THREE.MeshBasicMaterial({ color: 0xFFFFFF, transparent: true, opacity: 0.3 });
          const core = new THREE.Mesh(coreGeom, coreMat);
          scene.add(core);

          const light = new THREE.PointLight(0xF6B73C, 2, 10);
          light.position.set(2, 2, 5);
          scene.add(light);

          const ambientLight = new THREE.AmbientLight(0x404040, 1);
          scene.add(ambientLight);

          camera.position.z = 5;

          function animate() {
              requestAnimationFrame(animate);
              
              const time = Date.now() * 0.001;
              
              // Breathing/Pulse effect
              const pulse = Math.sin(time * 2.0) * 0.05 + 1.0;
              orb.scale.set(pulse, pulse, pulse);
              
              // Gentle floating rotation
              orb.rotation.y += 0.005;
              orb.rotation.z += 0.003;
              
              // Dynamic vertex displacement simulation
              orb.position.y = Math.sin(time * 1.5) * 0.1;
              
              renderer.render(scene, camera);
          }

          window.addEventListener('resize', () => {
              const w = container.clientWidth || window.innerWidth;
              const h = container.clientHeight || window.innerHeight;
              camera.aspect = w / h;
              camera.updateProjectionMatrix();
              renderer.setSize(w, h);
          });

          animate();
        })();
        </script>
      </div>
      <!-- STITCH_THREEJS_END:ANIMATION_15 -->
    </div>
  </div>

  <!-- Greeting Cluster -->
  <div class="text-center space-y-stack-sm mb-stack-lg relative z-10">

<script>
  // Micro-interaction for orb reaction to cursor movement
  const orbContainer = document.querySelector('.animate-float');
  if (orbContainer) {
    document.addEventListener('mousemove', (e) => {
      const xAxis = (window.innerWidth / 2 - e.pageX) / 45;
      const yAxis = (window.innerHeight / 2 - e.pageY) / 45;
      orbContainer.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
    });
  }

  // Interactive focus for input
  const mainInput = document.querySelector('input');
  if (mainInput) {
    mainInput.addEventListener('focus', () => {
      document.body.style.backgroundColor = "#090f15";
    });
    mainInput.addEventListener('blur', () => {
      document.body.style.backgroundColor = "";
    });
  }
</script>
